name: Offline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run complete offline backend suite
        # Block external networking, including spawned workers; retain loopback
        # for the suite's local HTTP tests. Dependency installation is above.
        run: |
          sudo --preserve-env=HF_HUB_OFFLINE,TRANSFORMERS_OFFLINE,HF_HUB_DISABLE_TELEMETRY,TOKENIZERS_PARALLELISM,OMP_NUM_THREADS,PYTHONDONTWRITEBYTECODE unshare --net bash -c '
            ip link set lo up
            exec runuser -u "$1" -- "$2" -B -m pytest backend/tests -q -p no:cacheprovider
          ' -- "$(id -un)" "$(command -v python)"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend Node tests
        run: node --test tests/reliability.test.mjs tests/api-configuration.test.mjs
      - name: Build frontend
        # A build-only placeholder, not a deployed API or a live service call.
        env:
          VITE_API_URL: https://api.example.test
        run: npm run build
