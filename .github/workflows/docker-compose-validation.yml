name: Docker Compose integration validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: dd-validation-${{ github.run_id }}-${{ github.run_attempt }}
      VALIDATION_NETWORK: dd-validation-${{ github.run_id }}-${{ github.run_attempt }}
      VALIDATION_BACKEND_IMAGE: deepdocs-backend:compose-${{ github.run_id }}-${{ github.run_attempt }}
      VALIDATION_FRONTEND_IMAGE: deepdocs-frontend:compose-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:compose.validation.yaml
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resource and configuration preflight
        timeout-minutes: 2
        run: |
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          test "$(docker info --format '{{.OSType}}')" = linux
          export DOCKER_ROOT=$(docker info --format '{{.DockerRootDir}}')
          echo "DOCKER_ROOT=$DOCKER_ROOT" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, shutil
          ram = int(dict(x.split(':', 1) for x in open('/proc/meminfo'))['MemAvailable'].split()[0]) * 1024
          disk = min(shutil.disk_usage(p).free for p in [os.getcwd(), os.environ['DOCKER_ROOT']])
          print(f'Available RAM={ram/2**30:.2f} GiB; free disk={disk/2**30:.2f} GiB')
          if ram < 5*2**30 or disk < 12*2**30:
              raise SystemExit('Require 5 GiB available RAM and 12 GiB disk; no automatic pruning.')
          PY
          test_dir=$(mktemp -d "$RUNNER_TEMP/compose-validation.XXXXXX")
          touch "$test_dir/empty.env"
          chmod 0644 "$test_dir/empty.env"
          echo "TEST_DIR=$test_dir" >> "$GITHUB_ENV"
          echo "BACKEND_ENV_FILE=$test_dir/empty.env" >> "$GITHUB_ENV"
          # Force Compose interpolation to use our empty file, never an implicit .env.
          echo "COMPOSE_ENV_FILES=$test_dir/empty.env" >> "$GITHUB_ENV"
          echo "COMPOSE_DISABLE_ENV_FILE=1" >> "$GITHUB_ENV"

      - name: Validate resolved Compose configuration
        timeout-minutes: 1
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" config --format json > "$TEST_DIR/resolved.json"
          docker compose version --short
          export VALIDATION_COMPOSE_VERSION="$(docker compose version --short)"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          def validate_creation_policy(bind, version, source, compose_files):
              assert isinstance(bind, dict), 'Invalid bind options'
              if 'create_host_path' in bind:
                  assert bind['create_host_path'] is False, 'Host-path creation is not disabled'
                  return
              # Compose 2.38.2 / compose-go 2.7.1 serialize this bool with omitempty.
              # Omission alone is NOT evidence of false. Require the reviewed version
              # and exact reviewed overlay (explicit false, no include/extends/anchors).
              # read_text normalizes checkout line endings. Re-review this proof when
              # changing the overlay or Compose version; do not just refresh the hash.
              assert version in ('2.38.2', 'v2.38.2'), 'Unreviewed Compose omission semantics'
              assert compose_files == 'compose.yaml:compose.validation.yaml', 'Unexpected Compose inputs'
              assert hashlib.sha256(source.encode('utf-8')).hexdigest() == 'd45982421d355174cd3f04144e796fff228dd14f5bcbe5ee6ba6dc02fcf21e1a', 'Unreviewed source host-path creation policy'
          def test_creation_policy(source):
              cases = [
                  ({'create_host_path': False}, '2.38.2', source, True),
                  ({}, '2.38.2', source, True),
                  ({'create_host_path': True}, '2.38.2', source, False),
                  ({'create_host_path': 'false'}, '2.38.2', source, False),
                  ({'create_host_path': None}, '2.38.2', source, False),
                  ({'create_host_path': 0}, '2.38.2', source, False),
                  (None, '2.38.2', source, False),
                  ([], '2.38.2', source, False),
                  ({}, '2.38.3', source, False),
                  ({}, '2.38.2', source.replace('create_host_path: false', 'create_host_path: true'), False),
                  ({}, '2.38.2', source.replace('          create_host_path: false\n', ''), False),
                  ({}, '2.38.2', source.replace('read_only: true', 'read_only: false'), False),
                  ({}, '2.38.2', source.replace('${BACKEND_ENV_FILE:?empty validation configuration required}', './backend/.env'), False),
              ]
              for number, (bind, version, text, accepted) in enumerate(cases, 1):
                  try:
                      validate_creation_policy(bind, version, text, 'compose.yaml:compose.validation.yaml')
                      actual = True
                  except AssertionError:
                      actual = False
                  assert actual == accepted, f'Creation policy regression {number}'
              try:
                  validate_creation_policy({}, '2.38.2', source, 'compose.yaml')
              except AssertionError:
                  pass
              else:
                  raise AssertionError('Unapproved Compose inputs accepted')
              print('PASS: 14 host-path creation policy regressions')
          override_source = pathlib.Path('compose.validation.yaml').read_text(encoding='utf-8')
          test_creation_policy(override_source)
          def validate_env_mount(mount, expected, temporary_root, workspace):
              equal = False
              check = 'temporary_path_isolation'
              try:
                  approved = pathlib.Path(expected).resolve(strict=True)
                  root = pathlib.Path(temporary_root).resolve(strict=True)
                  repo = pathlib.Path(workspace).resolve(strict=True)
                  assert approved.is_relative_to(root) and not approved.is_relative_to(repo), 'Resolved configuration check failed: approved.is_relative_to(root) and not approved.is_relative_to(repo)'
                  assert approved.name == 'empty.env' and approved.is_file(), "Resolved configuration check failed: approved.name == 'empty.env' and approved.is_file()"
                  assert approved.stat().st_nlink == 1, 'Resolved configuration check failed: approved.stat().st_nlink == 1'
                  source = pathlib.Path(mount.get('source', ''))
                  assert source.is_absolute(), 'Resolved configuration check failed: source.is_absolute()'
                  actual = source.resolve(strict=True)
                  equal = actual == approved
                  check = 'source_identity'
                  assert equal and not actual.is_relative_to(repo), 'Resolved configuration check failed: equal and not actual.is_relative_to(repo)'
                  check = 'mount_properties'
                  assert mount.get('type') == 'bind', "Resolved configuration check failed: mount.get('type') == 'bind'"
                  assert mount.get('target') == '/app/backend/.env', "Resolved configuration check failed: mount.get('target') == '/app/backend/.env'"
                  assert mount.get('read_only') is True, "Resolved configuration check failed: mount.get('read_only') is True"
                  check = 'create_host_path'
                  bind = mount.get('bind', {})
                  validate_creation_policy(bind, os.environ['VALIDATION_COMPOSE_VERSION'],
                                           override_source, os.environ['COMPOSE_FILE'])
                  # Read only the approved temporary file, never a rejected source.
                  check = 'temporary_file_empty'
                  assert approved.read_bytes() == b'', "Resolved configuration check failed: approved.read_bytes() == b''"
              except (AssertionError, OSError, ValueError, TypeError):
                  bind = mount.get('bind', {})
                  creation = (('omitted' if 'create_host_path' not in bind else
                               'false' if bind['create_host_path'] is False else
                               'true' if bind['create_host_path'] is True else 'invalid')
                              if isinstance(bind, dict) else 'invalid_bind')
                  print(json.dumps({'type': mount.get('type'), 'target': mount.get('target'),
                                    'source_matches_expected': equal,
                                    'read_only': mount.get('read_only'), 'failed_check': check,
                                    'create_host_path': creation}), flush=True)
                  raise AssertionError('Backend configuration mount failed isolation validation: ' + check) from None
          def duration_seconds(value):
              parts = re.findall(r'([0-9]+)(h|m|s)', value)
              assert parts and ''.join(n+u for n,u in parts) == value, "Resolved configuration check failed: parts and ''.join(n+u for n,u in parts) == value"
              return sum(int(n)*{'h':3600,'m':60,'s':1}[u] for n,u in parts)
          def validate_pdf_volume(pdf, volumes, project):
              expected = project + '_pdf_storage'
              source = pdf.get('source')
              try:
                  assert pdf.get('type') == 'volume', "Resolved configuration check failed: pdf.get('type') == 'volume'"
                  assert pdf.get('target') == '/app/backend/storage/documents', "Resolved configuration check failed: pdf.get('target') == '/app/backend/storage/documents'"
                  assert not pdf.get('read_only'), "Resolved configuration check failed: not pdf.get('read_only')"
                  # Resolve the logical reference when present; some resolved forms
                  # already contain the engine volume name. Neither may name other data.
                  assert source in ('pdf_storage', expected), "Resolved configuration check failed: source in ('pdf_storage', expected)"
                  assert isinstance(volumes, dict) and len(volumes) == 1, 'Resolved configuration check failed: isinstance(volumes, dict) and len(volumes) == 1'
                  key, declaration = next(iter(volumes.items()))
                  assert key in ('pdf_storage', expected), "Resolved configuration check failed: key in ('pdf_storage', expected)"
                  assert declaration.get('name') == expected, "Resolved configuration check failed: declaration.get('name') == expected"
                  assert not declaration.get('external'), "Resolved configuration check failed: not declaration.get('external')"
                  assert declaration.get('driver', 'local') == 'local', "Resolved configuration check failed: declaration.get('driver', 'local') == 'local'"
                  assert not declaration.get('driver_opts'), "Resolved configuration check failed: not declaration.get('driver_opts')"
                  resolved = declaration['name'] if source == key else source
                  assert resolved == expected, 'Resolved configuration check failed: resolved == expected'
              except (AssertionError, AttributeError, TypeError):
                  print(json.dumps({'type': pdf.get('type'), 'source': source,
                                    'expected_source': expected, 'target': pdf.get('target')}), flush=True)
                  raise AssertionError('Unexpected PDF volume identity or isolation') from None
          def validate_byte_limit(service, field, value, expected):
              # Compose JSON byte values may be decimal strings; Docker inspect uses integers.
              valid = type(value) is int or (isinstance(value, str) and re.fullmatch(r'[0-9]+', value))
              if not valid or int(value) != expected:
                  raise AssertionError(f'{service} {field}: resolved={value!r}; expected={expected} bytes')
          def validate_tmpfs(name, mounts):
              try:
                  assert isinstance(mounts, list) and len(mounts) == 1, 'Resolved configuration check failed: isinstance(mounts, list) and len(mounts) == 1'
                  path, separator, raw = mounts[0].partition(':')
                  assert path == '/tmp' and separator, "Resolved configuration check failed: path == '/tmp' and separator"
                  options = {}
                  for item in raw.split(','):
                      key, equals, value = item.partition('=')
                      assert key not in options, 'Duplicate tmpfs option'
                      options[key] = value if equals else None
                  # rw is the default if omitted; explicit ro/exec/suid are rejected.
                  assert set(options) <= {'rw', 'noexec', 'nosuid', 'size', 'mode'}, "Resolved configuration check failed: set(options) <= {'rw', 'noexec', 'nosuid', 'size', 'mode'}"
                  assert options.get('noexec', False) is None, "Resolved configuration check failed: options.get('noexec', False) is None"
                  assert options.get('nosuid', False) is None, "Resolved configuration check failed: options.get('nosuid', False) is None"
                  assert 'rw' not in options or options['rw'] is None, "Resolved configuration check failed: 'rw' not in options or options['rw'] is None"
                  size = re.fullmatch(r'([0-9]+)([kmg]?)', options.get('size') or '', re.I)
                  assert size, 'Resolved configuration check failed: size'
                  size_bytes = int(size[1]) * {'': 1, 'k': 1024, 'm': 1024**2, 'g': 1024**3}[size[2].lower()]
                  assert size_bytes == (128 if name == 'backend' else 64) * 1024**2, "Resolved configuration check failed: size_bytes == (128 if name == 'backend' else 64) * 1024**2"
                  mode = options.get('mode') or ''
                  assert re.fullmatch(r'0?[0-7]{4}', mode) and int(mode, 8) == 0o1777, "Resolved configuration check failed: re.fullmatch(r'0?[0-7]{4}', mode) and int(mode, 8) == 0o1777"
              except (AssertionError, AttributeError, TypeError, ValueError):
                  # Only the mount field is printed, never the full service config.
                  print(f'{name} resolved tmpfs: {json.dumps(mounts)}', flush=True)
                  raise AssertionError('Unexpected tmpfs path or security options') from None
          c = json.load(open(os.environ['TEST_DIR']+'/resolved.json'))
          assert c['name'] == os.environ['COMPOSE_PROJECT_NAME'], "Resolved configuration check failed: c['name'] == os.environ['COMPOSE_PROJECT_NAME']"
          assert set(c['services']) == {'frontend', 'backend'}, "Resolved configuration check failed: set(c['services']) == {'frontend', 'backend'}"
          for name, host, target in [('backend',8000,8000),('frontend',5173,8080)]:
              s = c['services'][name]
              assert s['image'] == os.environ['VALIDATION_'+name.upper()+'_IMAGE'], "Resolved configuration check failed: s['image'] == os.environ['VALIDATION_'+name.upper()+'_IMAGE']"
              assert pathlib.Path(s['build']['context']).resolve() == pathlib.Path(name).resolve(), "Resolved configuration check failed: pathlib.Path(s['build']['context']).resolve() == pathlib.Path(name).resolve()"
              assert (pathlib.Path(s['build']['context']) / s['build'].get('dockerfile', 'Dockerfile')).resolve() == pathlib.Path(name, 'Dockerfile').resolve(), "Resolved configuration check failed: (pathlib.Path(s['build']['context']) / s['build'].get('dockerfile', 'Dockerfile')).resolve() == pathlib.Path(name, 'Dockerfile').resolve()"
              assert s.get('command') is None and s.get('entrypoint') is None and not s.get('user'), "Resolved configuration check failed: s.get('command') is None and s.get('entrypoint') is None and not s.get('user')"
              assert not s.get('environment') and not s.get('env_file'), "Resolved configuration check failed: not s.get('environment') and not s.get('env_file')"
              assert not s.get('privileged') and not s.get('cap_add') and not s.get('devices'), "Resolved configuration check failed: not s.get('privileged') and not s.get('cap_add') and not s.get('devices')"
              assert not s.get('secrets') and not s.get('configs') and not s.get('volumes_from'), "Resolved configuration check failed: not s.get('secrets') and not s.get('configs') and not s.get('volumes_from')"
              assert not s.get('network_mode') and not s.get('pid') and not s.get('ipc'), "Resolved configuration check failed: not s.get('network_mode') and not s.get('pid') and not s.get('ipc')"
              assert set(s.get('networks') or {'default': None}) == {'default'}, 'Unexpected service network attachment'
              assert not s['build'].get('secrets') and not s['build'].get('ssh'), "Resolved configuration check failed: not s['build'].get('secrets') and not s['build'].get('ssh')"
              assert len(s['ports']) == 1, "Resolved configuration check failed: len(s['ports']) == 1"
              p=s['ports'][0]
              assert p['host_ip']=='127.0.0.1' and int(p['published'])==host and int(p['target'])==target, "Resolved configuration check failed: p['host_ip']=='127.0.0.1' and int(p['published'])==host and int(p['target'])==target"
              assert p.get('protocol', 'tcp') == 'tcp', "Resolved configuration check failed: p.get('protocol', 'tcp') == 'tcp'"
              assert s['read_only'] and s['cap_drop']==['ALL'], "Resolved configuration check failed: s['read_only'] and s['cap_drop']==['ALL']"
              assert s['security_opt']==['no-new-privileges:true'] and s['dns']==['127.0.0.1'], "Resolved configuration check failed: s['security_opt']==['no-new-privileges:true'] and s['dns']==['127.0.0.1']"
              validate_byte_limit(name, 'pids_limit', s.get('pids_limit'), 128 if name=='backend' else 64)
              assert float(s['cpus'])==(2 if name=='backend' else .5), "Resolved configuration check failed: float(s['cpus'])==(2 if name=='backend' else .5)"
              validate_byte_limit(name, 'mem_limit', s.get('mem_limit'), 3*2**30 if name=='backend' else 128*2**20)
              validate_tmpfs(name, s.get('tmpfs'))
          b=c['services']['backend']; f=c['services']['frontend']
          validate_byte_limit('backend', 'memswap_limit', b.get('memswap_limit'), 3*2**30)
          assert duration_seconds(b['stop_grace_period']) == 300, 'backend shutdown grace must be 300 seconds'
          assert duration_seconds(f['stop_grace_period']) == 30, 'frontend shutdown grace must be 30 seconds'
          assert f['build']['args']=={'VITE_API_URL':'http://127.0.0.1:8000'}, "Resolved configuration check failed: f['build']['args']=={'VITE_API_URL':'http://127.0.0.1:8000'}"
          assert not b['build'].get('args') and not f.get('volumes'), "Resolved configuration check failed: not b['build'].get('args') and not f.get('volumes')"
          assert len(b['volumes'])==2, "Resolved configuration check failed: len(b['volumes'])==2"
          mounts={v['target']:v for v in b['volumes']}
          assert set(mounts) == {'/app/backend/.env', '/app/backend/storage/documents'}, "Resolved configuration check failed: set(mounts) == {'/app/backend/.env', '/app/backend/storage/documents'}"
          env=mounts['/app/backend/.env']
          validate_env_mount(env, os.environ['BACKEND_ENV_FILE'], os.environ['RUNNER_TEMP'], os.getcwd())
          pdf=mounts['/app/backend/storage/documents']
          validate_pdf_volume(pdf, c.get('volumes'), os.environ['COMPOSE_PROJECT_NAME'])
          assert set(c['networks']) == {'default'}, "Resolved configuration check failed: set(c['networks']) == {'default'}"
          network = c['networks']['default']
          assert network['name'] == os.environ['VALIDATION_NETWORK'] and network['external'] is True, "Resolved configuration check failed: network['name'] == os.environ['VALIDATION_NETWORK'] and network['external'] is True"
          assert not network.get('internal') and not network.get('driver_opts') and not network.get('ipam'), "Resolved configuration check failed: not network.get('internal') and not network.get('driver_opts') and not network.get('ipam')"
          print('PASS: merged configuration, empty config mount, images, ports, storage and security.')
          PY

      - name: Build frontend then backend
        timeout-minutes: 28
        run: |
          timeout --signal=TERM --kill-after=30s 10m docker compose -p "$COMPOSE_PROJECT_NAME" build frontend
          # Recheck headroom before the larger build.
          python3 - <<'PY'
          import os, shutil
          ram=int(dict(x.split(':',1) for x in open('/proc/meminfo'))['MemAvailable'].split()[0])*1024
          disk=shutil.disk_usage(os.environ['DOCKER_ROOT']).free
          print(f'Before backend build: RAM={ram/2**30:.2f} GiB, disk={disk/2**30:.2f} GiB')
          assert ram>=5*2**30 and disk>=10*2**30, 'Insufficient remaining build resources'
          PY
          timeout --signal=TERM --kill-after=30s 17m docker compose -p "$COMPOSE_PROJECT_NAME" build backend

      - name: Establish fail-closed network isolation
        timeout-minutes: 2
        run: |
          # Support Docker's iptables backend only (including iptables-nft).
          # Never silently assume the native Docker nftables backend is equivalent.
          docker info --format '{{json .}}' > "$TEST_DIR/docker-info.json"
          sudo nft list tables > "$TEST_DIR/nft-tables.txt"
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json > "$TEST_DIR/daemon.json"
          else
            echo '{}' > "$TEST_DIR/daemon.json"
          fi
          python3 - <<'PY'
          import json, os, subprocess
          base=os.environ['TEST_DIR']
          info=json.load(open(base+'/docker-info.json')); config=json.load(open(base+'/daemon.json'))
          backend=info.get('FirewallBackend',config.get('firewall-backend','iptables'))
          assert backend=='iptables', 'Unsupported firewall backend; refusing startup'
          assert 'docker-bridges' not in open(base+'/nft-tables.txt').read(), 'Native Docker nftables detected'
          args=subprocess.check_output(['ps','-C','dockerd','-o','args='],text=True)
          assert args.strip() and 'nftables' not in args and '--iptables=false' not in args
          assert config.get('iptables',True) is True
          print('Docker firewall backend: iptables; native Docker nftables not detected.')
          PY
          sudo iptables --version
          sudo iptables -w 5 -C FORWARD -j DOCKER-USER
          sudo iptables -w 5 -t nat -S DOCKER >/dev/null
          bridge="dv$(printf '%s' "$COMPOSE_PROJECT_NAME" | sha256sum | cut -c1-10)"
          echo "$bridge" > "$TEST_DIR/bridge"
          docker network create --driver bridge \
            --label "deepdocs.validation=$COMPOSE_PROJECT_NAME" \
            --opt "com.docker.network.bridge.name=$bridge" "$VALIDATION_NETWORK"
          test "$(docker network inspect --format '{{.Internal}}/{{.EnableIPv6}}' "$VALIDATION_NETWORK")" = false/false
          # Reject new off-bridge traffic, but allow same-bridge communication.
          # Host-published request replies go to INPUT and must be allowed separately.
          sudo iptables -w 5 -I DOCKER-USER 1 -i "$bridge" ! -o "$bridge" \
            -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT
          sudo iptables -w 5 -I INPUT 1 -i "$bridge" -m conntrack ! --ctstate ESTABLISHED,RELATED \
            -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT
          sudo iptables -w 5 -C DOCKER-USER -i "$bridge" ! -o "$bridge" -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT
          sudo iptables -w 5 -C INPUT -i "$bridge" -m conntrack ! --ctstate ESTABLISHED,RELATED -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT
          # DNS upstream is container loopback in the overlay, preventing the Docker
          # embedded resolver from forwarding external lookups through the host.

      - name: Start and verify services
        timeout-minutes: 4
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --no-build --pull never
          for service in backend frontend; do
            id=$(docker compose -p "$COMPOSE_PROJECT_NAME" ps -q "$service")
            for attempt in $(seq 1 60); do
              test "$(docker inspect --format '{{.State.Running}}' "$id")" = true
              health=$(docker inspect --format '{{.State.Health.Status}}' "$id")
              if [ "$health" = healthy ]; then break; fi
              if [ "$health" = unhealthy ]; then exit 1; fi
              sleep 2
            done
            test "$health" = healthy
          done
          docker compose -p "$COMPOSE_PROJECT_NAME" exec -T frontend busybox wget -Y off -q -T 3 -O /dev/null http://backend:8000/api/health
          python3 - <<'PY'
          import json, os, subprocess
          for service,uid,mem,cpu,pids in [('backend','10001',3*2**30,2000000000,128),('frontend','101',128*2**20,500000000,64)]:
              cmd=['docker','compose','-p',os.environ['COMPOSE_PROJECT_NAME']]
              cid=subprocess.check_output(cmd+['ps','-q',service],text=True).strip()
              c=json.loads(subprocess.check_output(['docker','inspect',cid]))[0]
              image=json.loads(subprocess.check_output(['docker','image','inspect',c['Image']]))[0]
              for key in ['Cmd','Entrypoint','Env']:
                  assert c['Config'][key]==image['Config'][key]
              forbidden=('MONGODB_','QDRANT_','GEMINI_','JWT_','AWS_','GITHUB_TOKEN=')
              assert not any(v.startswith(forbidden) for v in c['Config']['Env'])
              assert c['Config']['User']==uid+':'+uid
              assert subprocess.check_output(cmd+['exec','-T',service,'id','-u'],text=True).strip()==uid
              h=c['HostConfig']
              assert h['ReadonlyRootfs'] and h['CapDrop']==['ALL']
              assert 'no-new-privileges:true' in h['SecurityOpt']
              assert h['Memory']==mem and h['NanoCpus']==cpu and h['PidsLimit']==pids
              assert h['Dns']==['127.0.0.1']
              if service == 'backend':
                  pdfs=[m for m in c['Mounts'] if m['Destination']=='/app/backend/storage/documents']
                  assert len(pdfs)==1 and pdfs[0]['Type']=='volume' and pdfs[0]['RW']
                  assert pdfs[0]['Name']==os.environ['COMPOSE_PROJECT_NAME']+'_pdf_storage'
              assert set(c['NetworkSettings']['Networks'])=={os.environ['VALIDATION_NETWORK']}
              assert all(x['HostIp']=='127.0.0.1' for bindings in c['NetworkSettings']['Ports'].values() for x in (bindings or []))
          print('PASS: running/healthy services, unchanged commands, nonroot security and service DNS/HTTP.')
          PY
          # Reserved documentation address: the reject counter must increase, proving
          # the attempt was stopped locally rather than relying on remote unavailability.
          sudo iptables-save -c > "$TEST_DIR/firewall-before"
          timeout 15s docker compose -p "$COMPOSE_PROJECT_NAME" exec -T backend python -B - <<'PY'
          import socket
          try:
              with socket.create_connection(('198.51.100.1',443),timeout=3):
                  raise AssertionError('External egress unexpectedly succeeded')
          except OSError:
              pass
          PY
          sudo iptables-save -c > "$TEST_DIR/firewall-after"
          python3 - <<'PY'
          import os,re
          def packets(file):
              lines=open(os.environ['TEST_DIR']+'/'+file).read().splitlines()
              lines=[x for x in lines if '-A DOCKER-USER ' in x and os.environ['COMPOSE_PROJECT_NAME'] in x]
              assert len(lines)==1
              return int(re.match(r'\[(\d+):',lines[0])[1])
          assert packets('firewall-after')>packets('firewall-before'), 'Egress rejection not proven'
          print('PASS: external egress rejected by scoped firewall rule.')
          PY

      - name: HTTP and CORS contracts
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, urllib.error
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def request(port,path,headers=None,method='GET'):
              req=urllib.request.Request(f'http://127.0.0.1:{port}{path}',headers=headers or {},method=method)
              try: r=opener.open(req,timeout=5)
              except urllib.error.HTTPError as e: r=e
              with r: return r.code,r.read(),r.headers
          code,root,_=request(5173,'/'); assert code==200 and b'<div id="root">' in root
          for path in ['/login','/knowledge-bases','/documents','/ask']:
              code,body,_=request(5173,path); assert code==200 and body==root
          assets=re.findall(r'(?:src|href)="(/assets/[^"\s]+)"',root.decode()); assert assets
          js=b''
          for path in assets:
              code,body,h=request(5173,path); assert code==200 and body and 'text/html' not in h['Content-Type']
              if path.endswith('.js'): js+=body
          assert b'http://127.0.0.1:8000' in js and b'http://backend:8000' not in js
          assert request(5173,'/assets/missing-validation.js')[0]==404
          origin='http://127.0.0.1:5173'
          code,body,h=request(8000,'/api/health',{'Origin':origin})
          assert code==200 and json.loads(body)['status']=='ok'
          assert h['Access-Control-Allow-Origin']==origin and 'Retry-After' in h['Access-Control-Expose-Headers']
          code,body,_=request(8000,'/api/ready'); assert code==503 and json.loads(body)['status']=='not_ready'
          code,_,h=request(8000,'/api/health',{'Origin':origin,'Access-Control-Request-Method':'GET','Access-Control-Request-Headers':'authorization,content-type'},'OPTIONS')
          assert code==200 and h['Access-Control-Allow-Origin']==origin
          assert 'GET' in h['Access-Control-Allow-Methods']
          assert all(x in h['Access-Control-Allow-Headers'].lower() for x in ['authorization','content-type'])
          for method in ['GET','OPTIONS']:
              _,_,h=request(8000,'/api/health',{'Origin':'https://unapproved.example','Access-Control-Request-Method':'GET'},method)
              assert h.get('Access-Control-Allow-Origin') is None
          print('PASS: host HTTP, SPA/assets, compiled API origin, readiness and CORS.')
          PY

      - name: PDF volume persistence across backend recreation
        timeout-minutes: 4
        run: |
          old=$(docker compose -p "$COMPOSE_PROJECT_NAME" ps -q backend)
          docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/backend/storage/documents"}}{{.Name}}{{end}}{{end}}' "$old" > "$TEST_DIR/pdf-volume"
          docker compose -p "$COMPOSE_PROJECT_NAME" exec -T backend python -B - "$COMPOSE_PROJECT_NAME" <<'PY'
          import hashlib,os,pathlib,sys
          assert os.getuid()==os.getgid()==10001
          assert pathlib.Path('/app/backend/.env').read_bytes()==b''
          p=pathlib.Path('/app/backend/storage/documents')/(sys.argv[1]+'.pdf')
          data=b'%PDF-1.4\n% Synthetic storage-only fixture; not an ingestion test.\n'
          with p.open('xb') as f: f.write(data)
          assert p.stat().st_uid==p.stat().st_gid==10001
          print('Fixture checksum:',hashlib.sha256(data).hexdigest())
          PY
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --no-deps --force-recreate --no-build --pull never backend
          new=$(docker compose -p "$COMPOSE_PROJECT_NAME" ps -q backend)
          test "$old" != "$new"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/backend/storage/documents"}}{{.Name}}{{end}}{{end}}' "$new")" = "$(cat "$TEST_DIR/pdf-volume")"
          for attempt in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$new")
            if [ "$health" = healthy ]; then break; fi
            test "$(docker inspect --format '{{.State.Running}}' "$new")" = true
            sleep 2
          done
          test "$health" = healthy
          docker compose -p "$COMPOSE_PROJECT_NAME" exec -T backend python -B - "$COMPOSE_PROJECT_NAME" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path('/app/backend/storage/documents')/(sys.argv[1]+'.pdf')
          expected=b'%PDF-1.4\n% Synthetic storage-only fixture; not an ingestion test.\n'
          assert hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256(expected).digest()
          assert p.stat().st_uid==p.stat().st_gid==10001
          print('PASS: fixture checksum, ownership and volume identity survived recreation.')
          PY
          bridge=$(cat "$TEST_DIR/bridge")
          sudo iptables -w 5 -C DOCKER-USER -i "$bridge" ! -o "$bridge" -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT
          sudo iptables -w 5 -C INPUT -i "$bridge" -m conntrack ! --ctstate ESTABLISHED,RELATED -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT

      - name: Graceful idle shutdown
        timeout-minutes: 6
        run: |
          timeout 320s docker compose -p "$COMPOSE_PROJECT_NAME" stop
          for service in backend frontend; do
            id=$(docker compose -p "$COMPOSE_PROJECT_NAME" ps -aq "$service")
            test "$(docker inspect --format '{{.State.Running}}/{{.State.ExitCode}}/{{.State.OOMKilled}}' "$id")" = false/0/false
          done
          echo 'PASS: bounded idle shutdown only; active-request draining is not tested.'

      - name: Diagnostics and project-scoped cleanup
        if: always()
        timeout-minutes: 3
        run: |
          # Labels scope removal even when setup or Compose startup failed partway.
          # Continue cleanup after individual errors, but report incomplete cleanup.
          set +e
          cleanup_failed=0
          for id in $(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"); do
            docker inspect --format 'State={{.State.Status}} Exit={{.State.ExitCode}} OOM={{.State.OOMKilled}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id" || true
            timeout 8s docker stats --no-stream --format 'Memory={{.MemUsage}} CPU={{.CPUPerc}} PIDs={{.PIDs}}' "$id" || true
            docker rm -f "$id" || cleanup_failed=1
          done
          for volume in $(docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"); do
            docker volume rm "$volume" || cleanup_failed=1
          done
          if docker network inspect "$VALIDATION_NETWORK" >/dev/null 2>&1; then
            if [ "$(docker network inspect --format '{{index .Labels "deepdocs.validation"}}' "$VALIDATION_NETWORK")" = "$COMPOSE_PROJECT_NAME" ]; then
              docker network rm "$VALIDATION_NETWORK" || cleanup_failed=1
            else
              cleanup_failed=1
            fi
          fi
          # Keep isolation in place if a disposable container could not be removed.
          if [ -z "$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")" ] && [ -n "${TEST_DIR:-}" ] && [ -f "$TEST_DIR/bridge" ]; then
            bridge=$(cat "$TEST_DIR/bridge")
            if sudo iptables -w 5 -C DOCKER-USER -i "$bridge" ! -o "$bridge" -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT 2>/dev/null; then
              sudo iptables -w 5 -D DOCKER-USER -i "$bridge" ! -o "$bridge" -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT || cleanup_failed=1
            fi
            if sudo iptables -w 5 -C INPUT -i "$bridge" -m conntrack ! --ctstate ESTABLISHED,RELATED -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT 2>/dev/null; then
              sudo iptables -w 5 -D INPUT -i "$bridge" -m conntrack ! --ctstate ESTABLISHED,RELATED -m comment --comment "$COMPOSE_PROJECT_NAME" -j REJECT || cleanup_failed=1
            fi
          fi
          for image in "$VALIDATION_FRONTEND_IMAGE" "$VALIDATION_BACKEND_IMAGE"; do
            if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image" || cleanup_failed=1; fi
          done
          # No global prune, production resources, raw logs or environment dumps.
          exit "$cleanup_failed"
