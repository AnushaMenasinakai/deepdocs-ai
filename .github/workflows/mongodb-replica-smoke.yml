name: Isolated MongoDB replica-set smoke tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TEST_ID: dd_smoke_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build disposable harness and run smoke tests
        timeout-minutes: 18
        run: bash experiments/mongodb-smoke/run.sh
      - name: Remove only job-owned containers and test image
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          [[ "$TEST_ID" =~ ^dd_smoke_[0-9]+_[0-9]+$ ]]
          export EVIDENCE_DIR="$RUNNER_TEMP/${TEST_ID}_evidence"
          mkdir -p "$EVIDENCE_DIR"
          sudo chown "$(id -u):$(id -g)" "$EVIDENCE_DIR"
          bash experiments/mongodb-smoke/run.sh --cleanup
      - name: Require complete acceptance evidence
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          export EVIDENCE_DIR="$RUNNER_TEMP/${TEST_ID}_evidence"
          bash experiments/mongodb-smoke/run.sh --verify-evidence
      - name: Retain only sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mongodb-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/${{ env.TEST_ID }}_evidence/sources.json
            ${{ runner.temp }}/${{ env.TEST_ID }}_evidence/resources.json
            ${{ runner.temp }}/${{ env.TEST_ID }}_evidence/recovery.json
            ${{ runner.temp }}/${{ env.TEST_ID }}_evidence/execution.json
            ${{ runner.temp }}/${{ env.TEST_ID }}_evidence/cleanup.json
