name: deepdocs-ai

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deepdocs-backend
    ports:
      - "127.0.0.1:8000:8000"
    # Keep the image's non-root user and single-worker exec command.
    # Allow in-flight work time to finish; interruption never authorizes recovery.
    stop_grace_period: 5m
    volumes:
      # A fresh volume inherits the image directory's UID 10001 / mode 0750.
      # Do not use `docker compose down --volumes` for storage you need to retain.
      - pdf_storage:/app/backend/storage/documents
      # Reuse config.py's dotenv parser without Compose interpolating secret values.
      # Supply a separate local file with BACKEND_ENV_FILE when needed.
      - type: bind
        source: ${BACKEND_ENV_FILE:-./backend/.env}
        target: /app/backend/.env
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public browser origin, not a Compose service hostname or secret.
        VITE_API_URL: http://127.0.0.1:8000
    image: deepdocs-frontend
    ports:
      - "127.0.0.1:5173:8080"
    # Inherit UID/GID 101:101 and SIGQUIT from the frontend image.
    restart: "on-failure:3"
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Alpine's existing BusyBox provides wget; no extra probe packages.
    # No dependency on backend readiness or external provider availability.
    healthcheck:
      test: ["CMD", "busybox", "wget", "-Y", "off", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pdf_storage:
